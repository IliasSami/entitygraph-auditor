[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entitygraph-auditor"
version = "0.1.0"
description = "EntityGraph Auditor — open-source entity/AEO/GEO/AI-retrieval content auditor (local-first)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143",
  "starlette>=0.48",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "httpx>=0.28",
  "beautifulsoup4>=4.12",
  "python-multipart>=0.0.20",
  "sse-starlette>=2.2",
  "uvicorn>=0.34",
  "langgraph>=0.6",
  "mcp>=1.16",
  "typing-extensions>=4.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "anyio>=4.6",
]
postgres = [
  "psycopg[binary]>=3.2",
]

[tool.setuptools.package-dir]
"ega_schemas" = "packages/schemas/ega_schemas"
"ega_scoring" = "packages/scoring/ega_scoring"
"ega_parsers" = "packages/parsers/ega_parsers"
"ega_providers" = "packages/providers/ega_providers"
"ega_mcp" = "packages/mcp/ega_mcp"
"ega_api" = "apps/api/app"

[tool.setuptools]
packages = [
  "ega_schemas",
  "ega_scoring",
  "ega_parsers",
  "ega_providers",
  "ega_mcp",
  "ega_api",
  "ega_api.routes",
  "ega_api.services",
  "auditor",
  "auditor.workflows",
  "auditor.agents",
  "auditor.rules",
  "auditor.prompts",
  "auditor.context_packs",
  "auditor.evaluation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
pythonpath = [".", "apps/api"]

[tool.ruff]
line-length = 100
target-version = "py312"
# `prism-geo/` is an unrelated nested repository that happens to live inside
# this working copy (own .git, not part of this package) — do not lint it.
extend-exclude = ["prism-geo"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
